<!-- Layout Principal da Aplicação - Otimizado para WebView -->
<main class="app-main webview-optimized" [class]="'webview-' + webViewType()">
  <div class="app-container">
    <div class="app-wrapper">
      <!-- Header da Aplicação -->
      <app-header class="app-header webview-performance"></app-header>
      
      <!-- Conteúdo Principal -->
      <main class="app-content webview-optimized webview-fade-in">
        <router-outlet />
      </main>
      
      <!-- Footer da Aplicação -->
      <app-footer class="app-footer webview-performance"></app-footer>
    </div>
  </div>
</main>
