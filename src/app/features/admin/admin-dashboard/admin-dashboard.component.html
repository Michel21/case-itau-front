      <button class="logout-btn" (click)="logout()">Sair</button>

  </div>

  <div class="admin-content">

    <div class="admin-card">
      <h2>👥 Gerenciamento de Usuários</h2>
      <p>Funcionalidade em desenvolvimento...</p>
    </div>

    <div class="admin-card">
      <h2>🐱 Gerenciamento de Gatos</h2>
      <p>Funcionalidade em desenvolvimento...</p>
    </div>
  </div>
