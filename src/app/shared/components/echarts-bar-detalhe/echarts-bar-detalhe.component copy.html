<div class="chart-container">
  <div class="chart-wrapper">
    <!-- Eixo Y fixo - alinhado com as linhas do gráfico (topo, centro, base) -->
    <div class="y-axis-fixed">
      <div class="y-axis-labels">
        <span class="y-label">R$ 170<br>mil</span>
        <span class="y-label">R$ 85<br>mil</span>
        <span class="y-label y-label-bottom">R$ 0</span>
      </div>
    </div>

    <!-- Área com scroll - apenas as barras (igual Downloads/files) -->
    <div class="chart-scroll-container">
      <div class="bars-scroll-wrapper">
        <div class="bars-container">
          <div class="chart-grid-lines" aria-hidden="true"></div>
          @for (data of chartData(); track data.month + data.year) {
            <div
              class="bar-wrapper"
              (click)="toggleBar(data)"
              [class.dimmed]="hasSelection() && !data.selected"
            >
              <div class="bar-container">
                @if (!hasSelection() || data.selected) {
                  <div
                    class="percentage-above"
                    [class.selected]="data.selected"
                    [class.positive]="data.isPositive"
                    [class.negative]="!data.isPositive"
                    [style.bottom.%]="getBarHeightPercent(data)"
                  >
                    <svg width="18" height="18" viewBox="0 0 16 16" class="arrow-small">
                      @if (data.isPositive) {
                        <path
                          d="M8 3L8 13M8 3L4 7M8 3L12 7"
                          stroke="currentColor"
                          stroke-width="2.5"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          fill="none"
                        />
                      } @else {
                        <path
                          d="M8 13L8 3M8 13L4 9M8 13L12 9"
                          stroke="currentColor"
                          stroke-width="2.5"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          fill="none"
                        />
                      }
                    </svg>
                    @if (!ocultarValores) {
                      <span>{{ formatPercent(data.percentage) }}%</span>
                    } @else {
                      <span>••••••</span>
                    }
                  </div>
                }
                <div
                  class="bar"
                  [class.selected]="data.selected"
                  [class.dimmed]="hasSelection() && !data.selected"
                  [style.height.%]="getBarHeightPercent(data)"
                ></div>
              </div>

              <div class="month-label" [class.selected]="data.selected">
                {{ data.month }}@if (data.year) {<br />{{ formatYearDisplay(data.year) }}}
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
