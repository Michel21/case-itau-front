<!-- Container wrapper com position relative -->
<div class="toggle-segmented-wrapper" role="none">
  <!-- Container visual (COMPLETAMENTE OCULTO de leitores de tela) -->
  <div 
    class="toggle-segmented"
    [ngClass]="hostClasses()"
    aria-hidden="true"
    role="none">
    
    @for (option of options(); track option.value; let idx = $index) {
      <div
        [id]="'visual-' + getOptionId(option, idx)"
        class="toggle-segmented__option"
        [ngClass]="getOptionClasses(option, idx)"
        tabindex="-1">
        
        <span class="toggle-segmented__label-text">
          {{ option.label }}
        </span>
      </div>
    }
  </div>

  <!-- Controles acessíveis (sobrepostos aos visuais, sem container para evitar "grupo") -->
  @for (option of options(); track option.value; let idx = $index) {
    <button
      type="button"
      [id]="getOptionId(option, idx)"
      class="sr-only-option"
      [attr.tabindex]="getTabIndex(option)"
      [attr.aria-label]="getCustomAnnouncement(option, idx)"
      (click)="selectOption(option)"
      (keydown)="onKeyDown($event, option, idx)">
    </button>
  }
</div>

<!-- Região aria-live para anúncios de seleção -->
<div 
  class="sr-only" 
  role="status" 
  aria-live="assertive" 
  aria-atomic="true">
  {{ anuncioSelecao() }}
</div>
