<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Exportação</title>
</head>
<body>
    <h1>Teste de Exportação PDF e CSV</h1>
    
    <button onclick="testarCSV()">Testar CSV</button>
    <button onclick="testarPDF()">Testar PDF</button>
    
    <script>
        function testarCSV() {
            const dados = {
                saldoAnterior: {
                    dataSaldo: '31/07/2025',
                    itens: [
                        {
                            dataAplicacao: '25/07/2025',
                            dataVencimento: '31/07/2025',
                            dataResgate: '',
                            taxa: 5.00,
                            valorPrincipal: 58.22,
                            valorBruto: 58.37,
                            rendaTotal: 0.15,
                            iof: 0.00,
                            irrf: 0.03,
                            valorLiquido: 58.34,
                            rendaBrutaPer: 0.00
                        }
                    ],
                    totalValorPrincipal: 58.22,
                    totalValorBruto: 58.37,
                    totalRendaTotal: 0.15,
                    totalIof: 0.00,
                    totalIrrf: 0.03,
                    totalValorLiquido: 58.34,
                    totalRendaBrutaPer: 0.00
                }
            };
            
            const csv = gerarCSV(dados);
            downloadFile(csv, 'teste.csv', 'text/csv;charset=utf-8;');
        }
        
        function testarPDF() {
            const dados = {
                saldoAnterior: {
                    dataSaldo: '31/07/2025',
                    itens: [
                        {
                            dataAplicacao: '25/07/2025',
                            dataVencimento: '31/07/2025',
                            dataResgate: '',
                            taxa: 5.00,
                            valorPrincipal: 58.22,
                            valorBruto: 58.37,
                            rendaTotal: 0.15,
                            iof: 0.00,
                            irrf: 0.03,
                            valorLiquido: 58.34,
                            rendaBrutaPer: 0.00
                        }
                    ],
                    totalValorPrincipal: 58.22,
                    totalValorBruto: 58.37,
                    totalRendaTotal: 0.15,
                    totalIof: 0.00,
                    totalIrrf: 0.03,
                    totalValorLiquido: 58.34,
                    totalRendaBrutaPer: 0.00
                }
            };
            
            const html = gerarHTML(dados);
            downloadFile(html, 'teste.html', 'text/html');
        }
        
        function gerarCSV(dados) {
            let csv = 'Seção,Data Aplica,Data Vencir,Data Resgal,Taxa (%),Valor Princi,Valor Bruto,Renda Tota,IOF (BRL),IRRF (BRL),Valor Líquic,Renda Bruta Per (BRL)\n';
            
            if (dados.saldoAnterior?.itens) {
                csv += `Saldo anterior em ${dados.saldoAnterior.dataSaldo}\n`;
                dados.saldoAnterior.itens.forEach(item => {
                    csv += `Saldo Anter,########,########,########,${item.taxa || ''},${formatarMoeda(item.valorPrincipal)},${formatarMoeda(item.valorBruto)},${formatarMoeda(item.rendaTotal)},${formatarMoeda(item.iof)},${formatarMoeda(item.irrf)},${formatarMoeda(item.valorLiquido)},${formatarMoeda(item.rendaBrutaPer)}\n`;
                });
                csv += `Saldo Anterior - TOTAL,,,,,${formatarMoeda(dados.saldoAnterior.totalValorPrincipal)},${formatarMoeda(dados.saldoAnterior.totalValorBruto)},${formatarMoeda(dados.saldoAnterior.totalRendaTotal)},${formatarMoeda(dados.saldoAnterior.totalIof)},${formatarMoeda(dados.saldoAnterior.totalIrrf)},${formatarMoeda(dados.saldoAnterior.totalValorLiquido)},${formatarMoeda(dados.saldoAnterior.totalRendaBrutaPer)}\n`;
            }
            
            return csv;
        }
        
        function gerarHTML(dados) {
            return `
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Teste Extrato</title>
    <style>
        body { font-family: Arial, sans-serif; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Teste de Extrato</h1>
    <table>
        <thead>
            <tr>
                <th>Data Aplic.</th>
                <th>Data Venc.</th>
                <th>Taxa (%)</th>
                <th>Valor Principal</th>
                <th>Valor Bruto</th>
            </tr>
        </thead>
        <tbody>
            ${dados.saldoAnterior?.itens?.map(item => `
                <tr>
                    <td>${item.dataAplicacao}</td>
                    <td>${item.dataVencimento}</td>
                    <td>${item.taxa}</td>
                    <td>${formatarMoeda(item.valorPrincipal)}</td>
                    <td>${formatarMoeda(item.valorBruto)}</td>
                </tr>
            `).join('') || ''}
        </tbody>
    </table>
</body>
</html>`;
        }
        
        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL',
                minimumFractionDigits: 2
            });
        }
        
        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
